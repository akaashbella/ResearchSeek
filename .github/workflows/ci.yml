name: Ubuntu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Ubuntu 24.04 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build

      - name: Install package and build native extension
        run: python -m pip install -e ".[dev]"

      - name: Verify native extension and SQLite FTS5
        run: |
          python - <<'PY'
          import importlib.machinery
          import sqlite3
          from researchseek import _native
          from researchseek.diagnostics import check_fts5

          assert any(_native.__file__.endswith(suffix) for suffix in importlib.machinery.EXTENSION_SUFFIXES)
          assert _native.diagnostic() == 201703
          check_fts5()
          print(f"Native extension: {_native.__file__}")
          print(f"C++ standard: {_native.diagnostic()}")
          print(f"SQLite {sqlite3.sqlite_version}: FTS5 available")
          PY

      - name: Run offline tests
        run: python -m pytest -q

      - name: Verify CLI help
        run: researchseek --help
